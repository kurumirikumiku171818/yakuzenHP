<!doctype html>
<html lang="jp">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>『はじめての薬膳体験』はこちら</title>
</head>
<body>
    <form>
    <label>お名前（必須）</label
    <input type="text" placeholder="名前を入力してください" required />
    <br/>
    <label>ふりがな（必須）</label
    ><input type="text" placeholder="ふりがな" required />
    <br/>
    <label>メールアドレス（必須）</label
    ><input
        type="text"
        placeholder="半角英数字のみ入力可能（例）abcde@example.com"
        required
    />
    <br/>
    <label>メールアドレス（確認用）</label
    ><input
        type="text"
        placeholder="上記と同じアドレスを入力してください"
        required
    />
    <br/>
    <label>第1希望日<label><input type="date" required>
    <br>
    <p>希望時間</p>
    <label>10:30</label><input type="radio" name="time">
    <label>16:30</label><input type="radio" name="time">
    <br/>
    <label>第2希望日<label><input type="date" required>
    <br/>
    <p>希望時間</p>
    <label>10:30</label><input type="radio" name="time">
    <label>16:30</label><input type="radio" name="time">
    <br>
    <label>第3希望日<label><input type="date" required>
    <br/>
    <p>希望時間</p>
    <label>10:30</label><input type="radio" name="time">
    <label>16:30</label><input type="radio" name="time">
    <br>
    <label>利用規約に同意する</label><input type="checkbox" />
    <br/>
    <input type="submit" value="送信" />
    <input type="reset" value="リセット" />
    </form>
</body>
</html>
