<!doctype html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/common/reset.css" />
    <link rel="stylesheet" href="./styles/common/common.css" />
    <link rel="stylesheet" href="./styles/common/header.css" />
    <link rel="stylesheet" href="./styles/pages/book-contact.css" />

    <title>『はじめての薬膳体験』はこちら</title>
  </head>
  <body>
    <header class="header-wrapper">
      <div class="flex">
        <h1 class="header-title">kokoro</h1>
        <nav>
          <ul class="flex">
            <li class="menu-list">
              <a href="/index.html">ホーム</a>
            </li>
            <li class="menu-list">
              <a href="/index.html#kokoro">教室について</a>
            </li>
            <li class="menu-list">
              <a href="/index.html#koushi">講師紹介</a>
            </li>
            <li class="menu-list">
              <a href="/index.html#voice">受講者の声</a>
            </li>
            <li class="menu-list">
              <a href="/index.html#koushi-vlog">講師ブログ</a>
            </li>
            <li class="menu-list">
              <a href="/contact.html">お問合わせ</a>
            </li>
            <li class="menu-list">
              <a href="/book.html">薬膳体験予約</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <form class="book-form">
      <div class="book-item">
        <label>お名前（必須）</label>
        <input type="text" placeholder="名前を入力してください" required />
      </div>

      <div class="book-item">
        <label>ふりがな（必須）</label>
        <input type="text" placeholder="ふりがな" required />
      </div>

      <div class="book-item">
        <label>メールアドレス（必須）</label>
        <input
          type="email"
          placeholder="半角英数字のみ入力可能（例）abcde@example.com"
          required
        />
      </div>

      <div class="book-item">
        <label>メールアドレス（確認用）</label>
        <input
          type="email"
          placeholder="上記と同じアドレスを入力してください"
          required
        />
      </div>

      <div class="book-date flex1">
        <label>第1希望日</label>
        <input type="date" required />
        <p>希望時間</p>
        <div class="time">
          <label>10:30</label>
          <input type="radio" name="time" />
          <label>16:30</label>
          <input type="radio" name="time" />
        </div>
      </div>

      <div class="book-date">
        <label>第2希望日</label>
        <input type="date" required />
        <p>希望時間</p>
        <div class="time">
          <label>10:30</label>
          <input type="radio" name="time" />
          <label>16:30</label>
          <input type="radio" name="time" />
        </div>
      </div>

      <div class="book-date">
        <label>第3希望日</label>
        <input type="date" required />
        <p>希望時間</p>
        <div class="time">
          <label>10:30</label>
          <input type="radio" name="time" />
          <label>16:30</label>
          <input type="radio" name="time" />
        </div>
      </div>

      <div class="book-item">
        <label>利用規約に同意する</label><input type="checkbox" />
      </div>

      <div class="form-button">
        <input type="submit" value="送信" />
        <input type="reset" value="リセット" />
      </div>
    </form>
  </body>
</html>
