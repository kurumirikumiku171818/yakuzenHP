<!doctype html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/contact-form.css" />
    <title>お問い合わせはこちら</title>
  </head>
  <body>
    <form class="contact-form">
      <div class="form-item">
        <label>お名前（必須）</label
        ><input type="text" placeholder="名前を入力してください" required />
      </div>

      <div class="form-item">
        <label>ふりがな（必須）</label
        ><input type="text" placeholder="ふりがな" required />
      </div>

      <div class="form-item">
        <label>メールアドレス（必須）</label
        ><input
          type="email"
          placeholder="半角英数字のみ入力可能（例）abcde@example.com"
          required
        />
      </div>

      <div class="form-item">
        <label>メールアドレス（確認用）</label
        ><input
          type="text"
          placeholder="上記と同じアドレスを入力してください"
          required
        />
      </div>

      <div class="form-item">
        <label>お問合せ内容</label><textarea></textarea>
      </div>

      <div class="form-item">
        <label>個人情報の取り扱いに同意する</label><input type="checkbox" />
      </div>

      <div class="form-button">
        <input type="submit" value="送信" />
        <input type="reset" value="リセット" />
      </div>
    </form>
  </body>
</html>
